name: Build Artifact

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的分支或标签'
        required: true
        default: 'main'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Run make
        run: |
          make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yewresin-${{ github.sha }}
          path: |
            yewresin.sh
            .env.example
          retention-days: 7
