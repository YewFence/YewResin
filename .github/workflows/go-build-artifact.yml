name: Go Build Artifact

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'go/**'
  pull_request:
    branches:
      - main
    paths:
      - 'go/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run tests
        working-directory: go
        run: go test -v ./...

      - name: Build all platforms
        working-directory: go
        run: make all

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yewresin-go-${{ github.sha }}
          path: |
            go/dist/*
            .env.example
          retention-days: 7
