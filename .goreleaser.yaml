version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: yewresin
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
      - .env.example

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "Merge pull request"
  groups:
    - title: Features
      regexp: "^.*feat[\\w\\)]*:+.*$"
      order: 0
    - title: Bug fixes
      regexp: "^.*fix[\\w\\)]*:+.*$"
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: YewFence
    name: yewresin
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

brews:
  - name: yewresin
    repository:
      owner: "{{ .Env.HOMEBREW_TAP_OWNER }}"
      name: "{{ .Env.HOMEBREW_TAP_NAME }}"
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/YewFence/yewresin"
    description: "Docker Compose service backup tool using Kopia + rclone"
    license: MIT
    install: |
      bin.install "yewresin"
    test: |
      system "#{bin}/yewresin --version"
    commit_msg_template: "Brew formula update for {{ .ProjectName }} v{{ .Tag }}"

